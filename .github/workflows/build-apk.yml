name: Build YAFTA Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate app JavaScript and assets
        run: |
          node --check app/src/main/assets/app.js
          test -s app/src/main/assets/app.css
          test -s app/src/main/assets/iran-locations.js
          grep -q 'href="app.css"' app/src/main/assets/index.html
          grep -q 'src="app.js"' app/src/main/assets/index.html
          grep -q '.overlay{display:flex}' app/src/main/assets/app.css
          echo "YAFTA JavaScript and local assets validated."
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yafta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
