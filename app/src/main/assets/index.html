<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08070b"><title>مافیا | شب آخر</title>
<style>
:root{--gold:#ffd16b;--red:#a7192b;--glass:#100d13eF;--line:#a8793d;--cream:#fff0d6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08070b;color:#fff3e2;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
#app{position:relative;width:100%;max-width:520px;min-height:100dvh;margin:auto;overflow:hidden;background:#09080c;padding-bottom:80px}
#art{position:fixed;z-index:0;inset:0;width:100%;max-width:520px;height:100dvh;left:50%;transform:translateX(-50%);object-fit:cover;object-position:center top}
#shade{position:fixed;z-index:1;inset:0;background:linear-gradient(180deg,#08070b12 0%,#08070b0a 50%,#08070be8 100%);pointer-events:none}
#home,#page{position:relative;z-index:2;min-height:100dvh}
#home{height:100dvh;max-height:100dvh}
.hot{position:absolute;border:0;background:transparent;border-radius:20px;outline:none}
.hot:active{background:#ffc44b20;box-shadow:inset 0 0 0 2px #ffd16b88}
#h-start{left:13%;right:13%;top:59%;height:10%}
#h-private{left:4%;width:44%;top:69%;height:9%}
#h-public{right:4%;width:44%;top:69%;height:9%}
#h-rank{left:4%;width:44%;top:79%;height:9%}
#h-shop{right:4%;width:48%;top:79%;height:9%}
#h-daily{left:1%;width:24%;top:10%;height:12%}
#h-home{right:80%;width:19%;bottom:0;height:10%}
#h-missions{right:60%;width:20%;bottom:0;height:10%}
#h-stats{right:40%;width:20%;bottom:0;height:10%}
#h-friends{right:20%;width:20%;bottom:0;height:10%}
#h-profile{right:0;width:20%;bottom:0;height:10%}
#page{display:none;padding:18px 14px 100px;min-height:100dvh;background:linear-gradient(180deg,#09080b2c,#09080bd9 36%,#09080bf5)}
.panel{border:1px solid #a8793d;border-radius:20px;background:linear-gradient(145deg,#17111beF,#09080bf2);box-shadow:0 10px 35px #000b;padding:16px;margin-top:10px}
h1,h2{margin:0 0 12px;color:var(--gold)}h1{font-size:23px}h2{font-size:19px}
p{line-height:1.8;color:#e4d4c1;font-size:13px}
.btn{width:100%;border:1px solid #f2c36c;border-radius:14px;background:linear-gradient(100deg,#b66c16,#ffe08a,#c37b1d);color:#231406;font-weight:bold;padding:13px;margin-top:9px;box-shadow:0 0 15px #ffb32d44}
.btn.secondary{background:#201821;color:#f6d99f;border-color:#8d642f;box-shadow:none}
.btn.danger{background:linear-gradient(90deg,#761324,#c83c3c);color:#fff;border-color:#ec7676}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{border:1px solid #8d642f;border-radius:15px;background:#17121ceF;color:#f6e7d0;padding:13px;text-align:right;min-height:72px}.tile b{display:block;color:var(--gold);margin-bottom:6px}.muted{font-size:11px;color:#b9a895}.pill{display:inline-block;border:1px solid #966c35;color:#ffdf9d;border-radius:20px;padding:5px 9px;font-size:11px;margin:2px}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.player{border:1px solid #60482c;border-radius:12px;background:#201923;padding:9px;font-size:12px;min-height:48px}.player.dead{opacity:.42;filter:grayscale(1);text-decoration:line-through}.player.you{border-color:#ffd16b;box-shadow:0 0 10px #ffd16b44}
.chat{max-height:230px;overflow:auto;background:#08070bdc;border:1px solid #493421;border-radius:12px;padding:10px;font-size:12px;line-height:1.9}.chat p{margin:3px 0;border-bottom:1px solid #30232a;padding:4px}.gold{color:var(--gold)}
.option{display:block;width:100%;padding:11px;margin:7px 0;text-align:right;border:1px solid #8e693a;border-radius:12px;background:#201821;color:#fff0d7}.option.selected{border-color:#ffd16b;background:#493019}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.back{border:1px solid #76562e;background:#18131a;color:#ffdda0;border-radius:12px;padding:8px 12px}
#notice{position:fixed;z-index:9;left:50%;bottom:88px;transform:translateX(-50%);background:#211820;border:1px solid #d2a252;border-radius:12px;padding:10px 16px;display:none;max-width:90%;font-size:12px}
.bottom{position:fixed;z-index:6;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:none;grid-template-columns:repeat(5,1fr);background:#09080bf2;border:1px solid #503923;border-bottom:0;border-radius:16px 16px 0 0;padding:5px 3px max(6px,env(safe-area-inset-bottom))}
.nav{border:0;background:transparent;color:#c9b9a8;font-size:10px;padding:5px 0}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:#ffd16b}
input{width:100%;border:1px solid #8d642f;border-radius:10px;padding:11px;background:#08070b;color:white}
@media(max-width:380px){.panel{padding:12px}.btn{padding:11px}.players{gap:5px}}
</style></head>
<body>
<div id="app"><img id="art" src="lobby-reference.jpg" alt=""><div id="shade"></div>
<section id="home">
<button class="hot" id="h-start" aria-label="شروع بازی" onclick="beginMatch()"></button>
<button class="hot" id="h-private" aria-label="اتاق خصوصی" onclick="openPage('rooms')"></button>
<button class="hot" id="h-public" aria-label="بازی تمرینی" onclick="beginMatch()"></button>
<button class="hot" id="h-rank" aria-label="رتبه بندی" onclick="openPage('rank')"></button>
<button class="hot" id="h-shop" aria-label="فروشگاه" onclick="openPage('shop')"></button>
<button class="hot" id="h-daily" aria-label="جوایز روزانه" onclick="openPage('missions')"></button>
<button class="hot" id="h-home" aria-label="خانه" onclick="goHome()"></button>
<button class="hot" id="h-missions" aria-label="ماموریت ها" onclick="openPage('missions')"></button>
<button class="hot" id="h-stats" aria-label="آمار" onclick="openPage('stats')"></button>
<button class="hot" id="h-friends" aria-label="دوستان" onclick="openPage('friends')"></button>
<button class="hot" id="h-profile" aria-label="پروفایل" onclick="openPage('profile')"></button>
</section>
<section id="page"></section>
<nav class="bottom" id="bottom">
<button class="nav active" onclick="goHome()"><span>⌂</span>خانه</button><button class="nav" onclick="openPage('missions')"><span>🎁</span>ماموریت</button><button class="nav" onclick="openPage('stats')"><span>🏆</span>آمار</button><button class="nav" onclick="openPage('friends')"><span>♟</span>دوستان</button><button class="nav" onclick="openPage('profile')"><span>👤</span>پروفایل</button>
</nav><div id="notice"></div></div>
<script>
const $=id=>document.getElementById(id);
const names=['آرمان','رها','سامان','نیلوفر','کامران','هستی','بردیا','ترانه','فرهاد'];
const bios=['تحلیل‌گر و آرام','شکاک و تندزبان','شوخ‌طبع و پرحرف','کم‌حرف و مرموز','منطقی و دقیق','احساسی و زودباور','جسور و اتهام‌زن','محتاط و باهوش','اهل بلوف و بازی روانی'];
const lines=[
['من فعلاً دارم همه رو زیر نظر می‌گیرم.','به نظرم عجله برای رأی دادن اشتباهه.','یکی باید توضیح بده چرا این‌قدر ساکته.'],
['این دفاعت اصلاً قانع‌کننده نبود!','من به رفتار آرمان مشکوکم، نه حرفش.','رأی من بر اساس تناقض‌های روز قبله.'],
['بچه‌ها یکم آروم‌تر، هنوز چیزی ثابت نشده.','من با این تحلیل موافق نیستم.','چرا بحث رو عوض می‌کنی؟'],
['ترجیح می‌دم بیشتر گوش کنم.','این رأی‌ها خیلی معنی‌دار بود.','حس می‌کنم یکی داره بازی رو هدایت می‌کنه.']
];
let game=null,meRole='',speechOn=true;
function toast(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}
function goHome(){$('home').style.display='block';$('page').style.display='none';$('bottom').style.display='none'}
function openPage(key){$('home').style.display='none';$('page').style.display='block';$('bottom').style.display='grid';document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));const data={
rooms:['اتاق‌های شب آخر','اتاق خصوصی تمرینی بساز؛ ۹ جایگاه دیگر با بات‌ها پر می‌شوند.','<button class="btn" onclick="beginMatch()">ساخت اتاق و شروع با بات‌ها</button><button class="btn secondary" onclick="toast(\'در نسخه آزمایشی فقط اتاق تمرینی آفلاین فعال است\')">اتاق دوستان (در دست توسعه)</button>'],
rank:['لیگ شب آخر','جدول امتیازات محلی؛ با بردن مسابقه‌ها رتبه‌ات بهتر می‌شود.','<div class="tile">🥇 بازیکن برتر — ۲۴۸۰ امتیاز</div><div class="tile">🥈 شب‌گرد — ۲۲۱۰ امتیاز</div><div class="tile">🥉 کارآگاه — ۱۹۸۰ امتیاز</div>'],
shop:['فروشگاه شب آخر','آواتار، قاب پروفایل، تاج و نشان‌های ظاهری؛ خرید واقعی در نسخه آزمایشی وجود ندارد.','<div class="grid"><button class="tile" onclick="toast(\'قاب طلایی به‌زودی\')">👑<b>قاب طلایی</b>قاب پروفایل</button><button class="tile" onclick="toast(\'آواتارها به‌زودی\')">🕶️<b>آواتارها</b>ظاهر بازیکن</button><button class="tile" onclick="toast(\'تاج‌ها به‌زودی\')">♛<b>تاج‌ها</b>نشان ویژه</button><button class="tile" onclick="toast(\'بسته ایموجی به‌زودی\')">✨<b>ایموجی‌ها</b>واکنش‌ها</button></div>'],
missions:['ماموریت‌ها و جوایز','ماموریت‌های روزانه برای افزایش سکه و امتیاز محلی.','<div class="tile">🎁 یک مسابقه کامل کن <b>+۱۰۰ سکه</b></div><div class="tile">🗳 سه رأی درست ثبت کن <b>+۷۵ سکه</b></div><div class="tile">🔍 یک مافیا را پیدا کن <b>+۵۰ سکه</b></div>'],
stats:['آمار و تاریخچه','نتایج مسابقه‌ها روی همین گوشی نگهداری می‌شوند.','<div id="history"></div>'],
friends:['دوستان و گروه','در نسخه آفلاین، می‌توانی بازیکن‌های بات را به فهرست علاقه‌مندی‌ها اضافه کنی.','<div class="tile">👥 فهرست بازیکنان پیشنهادی</div><button class="btn secondary" onclick="toast(\'بخش گروه آفلاین در حال توسعه است\')">ساخت گروه محلی</button>'],
profile:['پروفایل بازیکن','<label>نام نمایشی</label><input id="nick" value="'+(localStorage.nick||'بازیکن شب آخر')+'"><button class="btn" onclick="localStorage.nick=document.getElementById(\'nick\').value;toast(\'پروفایل ذخیره شد\')">ذخیره پروفایل</button><p>سطح ۱　 |　 تاج: تازه‌وارد</p>'],
settings:['تنظیمات','راوی، جلوه‌های صوتی و زمان‌بندی مسابقه.','<button class="btn secondary" onclick="toggleVoice()">راوی: '+(speechOn?'روشن':'خاموش')+'</button><button class="btn secondary" onclick="toast(\'تنظیمات ذخیره شد\')">ذخیره</button>']
};const d=data[key]||data.rank;$('page').innerHTML='<div class="topline"><h1>'+d[0]+'</h1><button class="back" onclick="goHome()">بازگشت</button></div><div class="panel"><p>'+d[1]+'</p>'+d[2]+'</div>';if(key==='stats')renderHistory()}
function toggleVoice(){speechOn=!speechOn;openPage('settings')}
function beginMatch(){
 const roles=['مافیا','مافیا','مافیا','دکتر','کارآگاه','شهروند','شهروند','شهروند','شهروند','شهروند'].sort(()=>Math.random()-.5);
 game={players:[{name:localStorage.nick||'بازیکن شب آخر',role:roles[0],you:true,alive:true,personality:'تو'} ,...names.map((n,i)=>({name:n,role:roles[i+1],you:false,alive:true,personality:bios[i],style:i%4}))],round:0,phase:'معرفی',log:[],history:[],votes:{},lastTarget:null,protected:null,checked:null};
 meRole=roles[0];intro();
}
function panel(title,body){$('home').style.display='none';$('bottom').style.display='none';$('page').style.display='block';$('page').innerHTML='<div class="topline"><h1>'+title+'</h1><button class="back" onclick="leaveGame()">خروج</button></div><div class="panel">'+body+'</div>'}
function leaveGame(){game=null;goHome()}
function log(n,t){game.log.push({n,t});if(game.log.length>100)game.log.shift()}
function sayNarrator(t){log('راوی',t)}
function speak(t){if(!speechOn||!window.speechSynthesis)return;try{let u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=.94;speechSynthesis.speak(u)}catch(e){}}
function intro(){sayNarrator('بازیکنان وارد میز شدند. ۱۰ نفر در مسابقه حضور دارند.');sayNarrator('نقش شما: '+meRole+'. نقش خود را محرمانه نگه دار.');panel('🎭 شب آخر | معرفی','<span class="pill">۱۰ بازیکن</span><span class="pill">۳ مافیا</span><span class="pill">سناریو کلاسیک</span><p>نقش شما با موفقیت تعیین شد. بازیکنان آماده‌اند. ابتدا معارفه انجام می‌شود و سپس شب اول آغاز خواهد شد.</p>'+playersHTML()+'<button class="btn" onclick="startNight()">شروع شب معارفه</button>')}
function playersHTML(){return '<div class="players">'+game.players.map((p,i)=>'<div class="player '+(p.alive?'':'dead')+(p.you?' you':'')+'">'+(p.you?'👑 ':'👤 ')+p.name+(p.you?' (شما)':'')+'<br><span class="muted">'+(p.alive?'زنده':'حذف‌شده')+'</span></div>').join('')+'</div>'}
function startNight(){game.phase='شب';if(game.round===0){game.round=1;sayNarrator('شب معارفه است؛ در این شب قتل انجام نمی‌شود.');panel('🌙 شب معارفه','<p>شهر به خواب می‌رود. مافیا اعضای تیم خود را می‌شناسند. نقش‌های ویژه برای شروع آماده می‌شوند.</p><button class="btn" onclick="dayIntro()">رفتن به روز معارفه</button>');return}nightActions()}
function dayIntro(){game.phase='روز معارفه';sayNarrator('روز معارفه آغاز شد. هر بازیکن فرصت معرفی کوتاه دارد.');botTalk(5);panel('☀️ روز معارفه','<p>نوبت صحبت بازیکنان است. به سبک حرف‌زدن، اعتمادبه‌نفس و تناقض‌ها توجه کن.</p>'+chatHTML()+'<button class="btn" onclick="dayDiscussion()">شروع بحث و اتهام</button>')}
function nightActions(){
 game.phase='شب';game.protected=null;game.checked=null;
 if(meRole==='مافیا'){panel('🌙 شب '+game.round,'<p>تیم مافیا بیدار است. یکی از بازیکنان را برای شلیک انتخاب کن.</p>'+targetButtons(false,true));return}
 if(meRole==='دکتر'){panel('🌙 شب '+game.round,'<p>چه کسی را نجات می‌دهی؟</p>'+targetButtons(true,false));return}
 if(meRole==='کارآگاه'){panel('🌙 شب '+game.round,'<p>هویت کدام بازیکن را بررسی می‌کنی؟</p>'+targetButtons(false,false));return}
 const target=alive().filter(p=>!p.you&&p.role!=='مافیا')[Math.floor(Math.random()*Math.max(1,alive().filter(p=>!p.you&&p.role!=='مافیا').length))];game.lastTarget=target?.name;dayBreak();
}
function alive(){return game.players.filter(p=>p.alive)}
function targetButtons(heal,mafia){return '<div class="players">'+alive().filter(p=>!p.you).map(p=>'<button class="option" onclick="nightPick(\''+p.name+'\',\''+(heal?'heal':mafia?'kill':'check')+'\')">'+p.name+'</button>').join('')+'</div><button class="btn secondary" onclick="dayBreak()">رد کردن نوبت</button>'}
function nightPick(name,kind){const p=game.players.find(x=>x.name===name);if(kind==='kill'){game.lastTarget=name;log('مافیا','هدف شب انتخاب شد.')}if(kind==='heal'){game.protected=name;log('دکتر','یک نفر را نجات داد.')}if(kind==='check'){game.checked=name;log('کارآگاه','نتیجه استعلام: '+name+' '+(p.role==='مافیا'?'مافیاست.':'مافیا نیست.'));toast(p.role==='مافیا'?'نتیجه: مافیا':'نتیجه: شهروند')}dayBreak()}
function dayBreak(){if(game.round===1&&game.phase==='شب'){dayIntro();return}
 const killed=game.lastTarget?game.players.find(p=>p.name===game.lastTarget):null;
 if(killed&&killed.alive&&killed.name!==game.protected){killed.alive=false;sayNarrator('صبح شد؛ '+killed.name+' در شب از بازی خارج شد.')}else sayNarrator('صبح شد؛ دیشب کسی از بازی خارج نشد.');
 game.lastTarget=null;game.round++;checkWin();if(game)dayDiscussion()}
function botTalk(count){for(let i=0;i<count;i++){let p=alive().filter(x=>!x.you)[i%Math.max(1,alive().filter(x=>!x.you).length)];if(!p)continue;let pool=lines[p.style];let t=pool[(game.round+i)%pool.length];log(p.name,t)}}
function chatHTML(){return '<div class="chat">'+game.log.slice(-18).map(x=>'<p><b class="gold">'+x.n+':</b> '+x.t+'</p>').join('')+'</div>'}
function dayDiscussion(){game.phase='بحث';botTalk(6);panel('🗣️ بحث روز '+game.round,'<p>بات‌ها بر اساس شخصیت خود صحبت می‌کنند. حرف‌هایشان را با رأی‌ها و رفتار شب‌های قبل مقایسه کن.</p>'+chatHTML()+'<p class="gold">نوبت توست؛ نظرت را بگو یا وارد رأی‌گیری شو.</p><input id="myline" placeholder="تحلیل یا اتهامت را بنویس..."><button class="btn secondary" onclick="sendMyLine()">ارسال صحبت</button><button class="btn" onclick="accusePhase()">رفتن به اتهام و رأی‌گیری</button>')}
function sendMyLine(){let t=$('myline').value.trim();if(!t)return;log('شما',t);botTalk(2);dayDiscussion()}
function accusePhase(){game.phase='اتهام';panel('⚖️ انتخاب مظنون','<p>به بازیکنی رأی بده که رفتارش مشکوک‌تر بوده است. بات‌ها نیز بر اساس سرنخ‌ها رأی می‌دهند.</p>'+voteButtons())}
function voteButtons(candidates=alive().filter(p=>!p.you)){return candidates.map(p=>'<button class="option" onclick="castVote(\''+p.name+'\')">🗳 رأی به '+p.name+'</button>').join('')}
function castVote(name){game.votes={};const candidates=alive().filter(p=>!p.you);candidates.forEach((p,i)=>{let pool=alive().filter(x=>!x.you&&x.name!==p.name);let target=pool[Math.floor(Math.random()*Math.max(1,pool.length))];if(target)game.votes[target.name]=(game.votes[target.name]||0)+1});game.votes[name]=(game.votes[name]||0)+1;const sorted=Object.entries(game.votes).sort((a,b)=>b[1]-a[1]);const top=sorted[0]?.[1]||0;const tied=sorted.filter(x=>x[1]===top).map(x=>x[0]);if(tied.length>1){game.runoff=tied;panel('⚖️ دفاعیه','<p>چند بازیکن رأی مساوی آورده‌اند. آن‌ها فرصت دفاع دارند؛ سپس رأی نهایی انجام می‌شود.</p>'+tied.map(n=>'<div class="tile"><b>'+n+'</b> فرصت دفاعیه</div>').join('')+tied.map(n=>'<button class="option" onclick="runoffVote(\''+n+'\')">رأی نهایی به '+n+'</button>').join('')+'<button class="btn secondary" onclick="startNight()">تساوی؛ رفتن به شب</button>');return}eliminate(sorted[0][0])}
function runoffVote(name){eliminate(name)}
function eliminate(name){const p=game.players.find(x=>x.name===name);if(p)p.alive=false;sayNarrator(name+' با رأی شهر از بازی خارج شد. نقش: '+(p?.role||'نامشخص'));game.history.push({round:game.round,eliminated:name,role:p?.role});checkWin();if(game)panel('📣 نتیجه رأی‌گیری','<p>'+name+' از بازی خارج شد.</p><p>نقش او: <b class="gold">'+p.role+'</b></p>'+playersHTML()+'<button class="btn" onclick="startNight()">شروع شب بعد</button>')}
function checkWin(){if(!game)return;const mafia=alive().filter(p=>p.role==='مافیا').length,city=alive().length-mafia;if(mafia===0){finish('شهروندان برنده شدند!')}else if(mafia>=city){finish('مافیا برنده شد!')}}
function finish(result){const rec=JSON.parse(localStorage.matchHistory||'[]');rec.unshift({result,round:game.round,role:meRole,date:new Date().toLocaleDateString('fa-IR')});localStorage.matchHistory=JSON.stringify(rec.slice(0,20));panel('🏆 پایان مسابقه','<h2>'+result+'</h2><p>نقش شما: '+meRole+' | تعداد شب‌ها: '+game.round+'</p>'+game.players.map(p=>'<div class="tile">'+p.name+' — '+p.role+'</div>').join('')+'<button class="btn" onclick="beginMatch()">بازی دوباره</button><button class="btn secondary" onclick="leaveGame()">بازگشت به خانه</button>');game=null}
function renderHistory(){let h=JSON.parse(localStorage.matchHistory||'[]');$('history').innerHTML=h.length?h.map(x=>'<div class="tile">'+x.date+' — '+x.result+'<br><span class="muted">نقش: '+x.role+' | شب: '+x.round+'</span></div>').join(''):'<p>هنوز مسابقه‌ای ثبت نشده است.</p>'}
function leaveGame(){game=null;goHome()}
goHome();
</script></body></html>
