<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b16"><title>مافیا | شب آخر</title>
<style>
:root{--g:#f5c46a;--bg:#080d19}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#f7eee0;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{max-width:520px;min-height:100dvh;margin:auto;background:radial-gradient(ellipse at 50% 20%,#203455,#0b1425 55%,#070a13);padding-bottom:80px}.view{display:none;min-height:100dvh;padding:14px 13px 95px}.view.active{display:block}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.brand{font-weight:bold;color:var(--g)}.back{border:1px solid #76572f;background:#101827;color:#f7d58f;border-radius:12px;padding:8px 12px}.panel{background:linear-gradient(145deg,#17233be8,#090f1ff2);border:1px solid #876632;border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 10px 25px #0007}h1,h2{color:var(--g);margin:0 0 12px}h1{font-size:21px}h2{font-size:17px}p{font-size:13px;line-height:1.8;color:#d9d6d1}.btn{border:1px solid #ffe09b;background:linear-gradient(100deg,#a66a24,#ffdc83,#a96c25);color:#211507;border-radius:13px;padding:12px;width:100%;margin-top:8px;font-weight:bold}.btn.alt{background:#17243b;color:#f7dca6;border-color:#876632}.homehero{border:1px solid #9a7139;border-radius:20px;padding:22px 14px;text-align:center;background:linear-gradient(145deg,#182947,#090e1c);min-height:260px;display:flex;flex-direction:column;justify-content:center}.logo{font-size:46px;font-weight:1000;color:#f8d48c;text-shadow:0 4px #6d3d17,0 0 25px #e6a63c88}.sub{color:#d6b477;letter-spacing:4px;margin:8px 0 24px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 35% 25%,#526b8e,#17243b 65%,#090d17);border:2px solid var(--g)}.progress{height:7px;background:#343a48;border-radius:20px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#b97b2b,#ffe29a);width:0}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat,.tile{background:#101b30;border:1px solid #76572f;border-radius:12px;padding:10px;text-align:center;font-size:12px}.stat b,.tile b{display:block;color:var(--g);margin-top:5px}.grid{grid-template-columns:1fr 1fr}.tile{min-height:76px;color:#fff}.lobbyStage{height:min(72vh,760px);min-height:540px;position:relative;border-radius:16px;overflow:hidden;border:1px solid #53617b;background:#10192a}.lobbyStage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.seat{position:absolute;width:23%;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;flex-direction:column;gap:2px;text-align:center}.face{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid #a9bbd2;background:radial-gradient(circle at 30% 25%,#657f9d,#14223a 70%);box-shadow:0 0 0 3px #926b38,0 3px 12px #000b}.seat.you .face{border-color:#ffe18c;box-shadow:0 0 0 3px #b17c32,0 0 16px #ffca61}.seat.dead .face{filter:grayscale(1);opacity:.5;border-color:#a63b45}.num{position:absolute;top:-5px;right:-7px;background:#e4eaf0;color:#142033;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center}.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;background:#07101df2;border:1px solid #72552f;padding:3px 5px;font-size:10px}.lvl{font-size:9px;color:#f0c875}.seat.empty .face{border:2px dashed #8b9bb3;background:#0c1930aa;color:#8192a9;box-shadow:none}.tableInfo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#f6d58f;text-shadow:0 2px 8px #000;pointer-events:none}.tableInfo b{display:block;font-size:15px}.lobbyFoot{background:#080f1df2;border:1px solid #76572f;border-radius:12px;padding:10px;margin-top:8px;text-align:center;font-size:12px}.badge{border:1px solid #866433;border-radius:30px;padding:5px 9px;color:#f7d18a;font-size:11px}.role{text-align:center;padding:20px;border:1px solid #d1a450;border-radius:18px;background:radial-gradient(circle at top,#3c2130,#101528 70%)}.role .ico{font-size:58px}.role .name{font-size:27px;font-weight:bold;color:#f8d48c;margin:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{background:#14223a;border:1px solid #7d633e;color:#fff0d3;border-radius:12px;padding:11px;text-align:right;font-size:12px}.chat{max-height:30vh;overflow:auto;background:#070d19;border:1px solid #465875;border-radius:12px;padding:9px}.msg{padding:7px 4px;border-bottom:1px solid #27344a;font-size:12px;line-height:1.7}.msg b{color:#f4ca78}.row{display:flex;justify-content:space-between;align-items:center;background:#101b30;border:1px solid #4d5e79;border-radius:11px;padding:10px;margin:7px 0;font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:9;background:#080e1bf2;border:1px solid #5d492d;border-bottom:0;border-radius:15px 15px 0 0;padding:6px 3px max(6px,env(safe-area-inset-bottom))}.nav{background:none;border:0;color:#aeb8c7;font-size:10px}.nav span{display:block;font-size:20px}.nav.active{color:#ffd77f}#toast{position:fixed;z-index:20;bottom:85px;left:50%;transform:translateX(-50%);display:none;background:#101b30;border:1px solid #e2b65d;border-radius:12px;padding:10px 14px;font-size:12px;max-width:90%}@media(max-height:700px){.lobbyStage{min-height:500px;height:67vh}.face{width:42px;height:42px}}
</style></head><body><main id="app">
<section id="home" class="view active"><div class="top"><div class="profile"><div class="avatar" id="homeAvatar">🕶️</div><div><b id="nick">بازیکن شب آخر</b><div id="level" style="font-size:11px;color:#c8b68f">سطح ۱</div><div class="progress" style="width:130px"><i id="xpbar"></i></div></div></div><div style="text-align:left;color:#f4d28e;font-size:12px">🪙 <b id="coins">۵۰۰</b><br>💎 <b id="gems">۰</b></div></div><div class="homehero"><div class="logo">مافیا</div><div class="sub">شـب آخـر</div><button class="btn" onclick="beginMatch()">🎲 شروع بازی</button><small style="margin-top:10px;color:#c9b9a0">۱۰ بازیکن • ۳ مافیا • کاملاً آفلاین</small></div><div class="stats"><div class="stat">رتبه<b id="rank">#۱</b></div><div class="stat">بردها<b id="wins">۰</b></div><div class="stat">بازی‌ها<b id="matches">۰</b></div></div><div class="grid"><button class="tile" onclick="openPage('rooms')">👥<b>اتاق خصوصی</b>بازی با بات‌ها</button><button class="tile" onclick="beginMatch()">🎮<b>بازی تمرینی</b>شروع سریع</button><button class="tile" onclick="openPage('rank')">🏆<b>رتبه‌بندی</b>جدول امتیاز</button><button class="tile" onclick="openPage('shop')">🛍️<b>فروشگاه</b>آیتم‌ها</button><button class="tile" onclick="openPage('missions')">🎁<b>ماموریت‌ها</b>پاداش</button><button class="tile" onclick="openPage('stats')">📊<b>آمار</b>تاریخچه</button></div></section>
<section id="lobby" class="view"><div class="top"><button class="back" onclick="cancelLobby()">✕ خروج</button><b class="brand">لابی شب آخر</b><span class="badge" id="count">۱ / ۱۰</span></div><div class="lobbyStage"><img src="lobby-bg.svg" alt="پس‌زمینه لابی"><div id="seats"></div><div class="tableInfo"><span style="font-size:42px">♠</span><b>شب آخر</b><small>میز مافیا</small></div></div><div class="lobbyFoot"><b id="lobbyStatus">در انتظار ورود بازیکنان...</b><div class="progress"><i id="lobbyBar"></i></div><small>پس از تکمیل میز، نقش‌ها خودکار پخش می‌شوند.</small></div></section>
<section id="game" class="view"><div class="top"><button class="back" onclick="exitGame()">خروج</button><b class="brand">مافیا | شب آخر</b><span class="badge" id="round">شب ۱</span></div><div id="gameContent"></div></section>
<section id="page" class="view"><div class="top"><button class="back" onclick="show('home')">بازگشت</button><b class="brand" id="pageTitle">بخش بازی</b></div><div id="pageContent"></div></section>
<nav class="bottom" id="bottom"><button class="nav active" onclick="show('home')"><span>⌂</span>خانه</button><button class="nav" onclick="openPage('missions')"><span>🎁</span>ماموریت</button><button class="nav" onclick="openPage('rank')"><span>🏆</span>رتبه</button><button class="nav" onclick="openPage('friends')"><span>♟</span>دوستان</button><button class="nav" onclick="openPage('profile')"><span>👤</span>پروفایل</button></nav><div id="toast"></div></main>
<script>
const $=x=>document.getElementById(x),A=['🕶️','👩🏻','🧔🏻','👨🏽','👩🏽‍🦱','🧑🏻‍💼','👨🏻‍🦰','👩🏻‍🦳','🧔🏽‍♂️','👩🏾'],N=['آرمان','رها','سامان','نیلوفر','کامران','هستی','بردیا','ترانه','فرهاد'],P=['تحلیل‌گر و آرام','شکاک و تندزبان','شوخ‌طبع و پرحرف','کم‌حرف و مرموز','منطقی و دقیق','احساسی و زودباور','جسور و اتهام‌زن','محتاط و باهوش','اهل بلوف'],S=[['همه رو زیر نظر دارم.','برای رأی عجله نکنیم.','رفتار شب قبل مهم‌تره.'],['این دفاع قانع‌کننده نبود.','به سکوت بعضی‌ها مشکوکم.','یکی بحث رو عوض می‌کنه.'],['هنوز مدرک نداریم.','چرا کسی درباره دیشب حرف نمی‌زنه؟','به رأی‌های هماهنگ شک دارم.'],['ترجیح می‌دم گوش کنم.','این رأی‌ها معنی‌دار بود.','یکی بازی رو هدایت می‌کنه.']],R=['مافیا','مافیا','مافیا','دکتر','کارآگاه','شهروند','شهروند','شهروند','شهروند','شهروند'];
let g=null,t1=null,t2=null,t3=null,toastT=null;
function prof(){return JSON.parse(localStorage.profile||'{"nick":"بازیکن شب آخر","coins":500,"gems":0,"xp":0,"wins":0,"matches":0,"avatar":"🕶️","owned":[]}')}
function save(p){localStorage.profile=JSON.stringify(p);refresh()}
function refresh(){let p=prof(),lv=Math.floor(p.xp/250)+1;$('nick').textContent=p.nick;$('homeAvatar').textContent=p.avatar;$('level').textContent='سطح '+lv+' • '+p.xp+' XP';$('xpbar').style.width=(p.xp%250/250*100)+'%';$('coins').textContent=p.coins.toLocaleString('fa-IR');$('gems').textContent=p.gems.toLocaleString('fa-IR');$('wins').textContent=p.wins.toLocaleString('fa-IR');$('matches').textContent=p.matches.toLocaleString('fa-IR');$('rank').textContent='#'+Math.max(1,1000-Math.floor(p.xp/10)).toLocaleString('fa-IR')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>$('toast').style.display='none',2200)}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');$('bottom').style.display=id==='home'||id==='page'?'grid':'none'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openPage(k){let p=prof(),d={rooms:['اتاق خصوصی','این نسخه آفلاین است؛ میز با ۹ بات پر می‌شود.','<button class="btn" onclick="beginMatch()">ساخت اتاق تمرینی</button>'],rank:['رتبه‌بندی','رتبه محلی بر اساس تجربه و بردهای ذخیره‌شده.','<div class="row">🥇 '+esc(p.nick)+' <b>'+p.xp+' XP</b></div><div class="row">🥈 شب‌گرد <b>۲۴۰۰ XP</b></div><div class="row">🥉 کارآگاه <b>۱۸۵۰ XP</b></div>'],shop:['فروشگاه','آیتم‌ها با سکه واقعی داخل بازی خریداری و ذخیره می‌شوند.','<div class="grid">'+[['قاب طلایی','👑',250],['آواتار مرموز','🕵️',180],['قاب یاقوتی','💠',320],['کلاه مافیا','🎩',150]].map(x=>'<button class="tile" onclick="buy('+x[2]+',\''+x[0]+'\')">'+x[1]+'<b>'+x[0]+'</b>'+x[2]+' سکه</button>').join('')+'</div>'],missions:['ماموریت‌ها','پاداش‌ها بعد از مسابقه به موجودی اضافه می‌شوند.','<div class="row">🎲 تکمیل مسابقه <b>+۱۰۰ سکه</b></div><div class="row">🏆 برد مسابقه <b>+۱۵۰ سکه</b></div>'],stats:['آمار و تاریخچه','نتایج قبلی ذخیره می‌شوند.','<div id="history"></div>'],friends:['دوستان','بازی فعلاً تک‌نفره و آفلاین است.','<p>فهرست دوستان آنلاین در این نسخه فعال نیست.</p>'],profile:['پروفایل','نام و آواتار بازیکن را تغییر بده.','<div class="profile"><div class="avatar">'+p.avatar+'</div><b>'+esc(p.nick)+'</b></div><p>نام بازیکن</p><input id="nickInput" value="'+esc(p.nick)+'" maxlength="20"><div class="grid">'+A.map(a=>'<button class="tile" onclick="avatar(\''+a+'\')">'+a+'</button>').join('')+'</div><button class="btn" onclick="saveNick()">ذخیره نام</button>']}[k];show('page');$('pageTitle').textContent=d[0];$('pageContent').innerHTML='<div class="panel"><p>'+d[1]+'</p>'+d[2]+'</div>';if(k==='stats'){let h=JSON.parse(localStorage.history||'[]');$('history').innerHTML=h.length?h.map(x=>'<div class="row">'+x.date+' • '+x.result+' <b>'+x.role+'</b></div>').join(''):'<p>هنوز مسابقه‌ای ثبت نشده.</p>'}}
function buy(cost,name){let p=prof();if(p.owned.includes(name))return toast('قبلاً خریدی');if(p.coins<cost)return toast('سکه کافی نیست');p.coins-=cost;p.owned.push(name);save(p);toast('خرید انجام شد')}
function avatar(a){let p=prof();p.avatar=a;save(p);openPage('profile')}
function saveNick(){let p=prof();p.nick=$('nickInput').value.trim()||'بازیکن شب آخر';save(p);openPage('profile')}
function stop(){clearTimeout(t1);clearTimeout(t2);clearInterval(t3);t1=t2=t3=null}
const POS=[[50,9],[80,18],[88,38],[82,62],[70,87],[30,87],[18,62],[12,38],[20,18],[50,3]];
function beginMatch(){stop();g={players:[{name:prof().nick,you:true,avatar:prof().avatar,alive:true,level:Math.floor(prof().xp/250)+1}],round:0,phase:'lobby',log:[],role:null,kill:null,heal:null};show('lobby');renderLobby();let n=0;function add(){if(!g||g.phase!=='lobby')return;if(n<N.length){g.players.push({name:N[n],avatar:A[n+1],alive:true,level:12+Math.floor(Math.random()*20),style:n%4,personality:P[n]});n++;renderLobby();t1=setTimeout(add,420)}else{$('lobbyStatus').textContent='میز کامل شد؛ پخش نقش‌ها...';$('lobbyBar').style.width='100%';t1=setTimeout(deal,900)}}t1=setTimeout(add,450)}
function renderLobby(){$('count').textContent=g.players.length+' / ۱۰';$('lobbyStatus').textContent=g.players.length===10?'میز کامل شد!':'در انتظار ورود بازیکنان...';$('lobbyBar').style.width=g.players.length*10+'%';$('seats').innerHTML=Array.from({length:10},(_,i)=>{let p=g.players[i],v=POS[i];return '<div class="seat '+(p&&p.you?'you':'')+(p?'':' empty')+'" style="left:'+v[0]+'%;top:'+v[1]+'%">'+(p?'<div class="face">'+p.avatar+'<span class="num">'+(i+1)+'</span></div><div class="tag">'+esc(p.name)+'</div><div class="lvl">Lv.'+(p.level||1)+'</div>':'<div class="face">＋</div><div class="tag">در انتظار</div>')+'</div>'}).join('')}
function cancelLobby(){stop();g=null;show('home')}
function deal(){if(!g)return;let roles=[...R];for(let i=9;i>0;i--){let j=Math.floor(Math.random()*(i+1));[roles[i],roles[j]]=[roles[j],roles[i]]}g.players.forEach((p,i)=>p.role=roles[i]);g.role=roles[0];g.phase='role';show('game');let x={مافیا:['🔪','تو مافیا هستی','شب‌ها با هم‌تیمی‌ها هدف انتخاب کن.'],دکتر:['🩺','تو دکتر هستی','هر شب یک نفر را نجات بده.'],کارآگاه:['🔍','تو کارآگاهی','هر شب هویت یک نفر را بررسی کن.'],شهروند:['🧑‍🤝‍🧑','تو شهروندی','با تحلیل و رأی‌گیری مافیا را پیدا کن.']}[g.role];$('gameContent').innerHTML='<div class="role"><div class="ico">'+x[0]+'</div><div class="name">'+x[1]+'</div><p>'+x[2]+'</p><span class="badge">نقش محرمانه</span></div><p style="text-align:center">شروع بازی خودکار...</p>';$('round').textContent='نقش شما';t2=setTimeout(night,4000)}
function alive(){return g.players.filter(p=>p.alive)}function bots(){return alive().filter(p=>!p.you)}
function night(){if(!g)return;g.phase='night';g.round++;g.kill=null;g.heal=null;$('round').textContent='شب '+g.round;let s='<div class="panel"><h2>🌙 شب '+g.round+'</h2><p>شهر خواب است؛ عملیات شبانه انجام می‌شود.</p>';if(g.role==='مافیا')s+='<p>هدف شلیک را انتخاب کن.</p>'+targets(p=>p.role!=='مافیا','kill');else if(g.role==='دکتر')s+='<p>چه کسی را نجات می‌دهی؟</p>'+targets(()=>true,'heal');else if(g.role==='کارآگاه')s+='<p>هویت چه کسی را بررسی می‌کنی؟</p>'+targets(()=>true,'check');else s+='<p>نقش تو اقدام شبانه ندارد؛ صبح خودکار بیدار می‌شوی.</p>';s+='</div>'; $('gameContent').innerHTML=s;if(g.role==='شهروند')t2=setTimeout(resolveNight,2600)}
function targets(f,k){return '<div class="actions">'+alive().filter(p=>!p.you&&f(p)).map(p=>'<button class="choice" onclick="nightPick(\''+esc(p.name)+'\',\''+k+'\')">'+p.avatar+' '+esc(p.name)+'</button>').join('')+'</div><button class="btn alt" onclick="resolveNight()">رد کردن</button>'}
function nightPick(name,k){if(!g||g.phase!=='night')return;let p=g.players.find(x=>x.name===name);if(k==='kill')g.kill=name;if(k==='heal')g.heal=name;if(k==='check')toast(p.role==='مافیا'?'استعلام: مافیاست':'استعلام: مافیا نیست');clearTimeout(t2);t2=setTimeout(resolveNight,700)}
function resolveNight(){if(!g||g.phase!=='night')return;let aliveNow=alive(),mafia=aliveNow.filter(p=>p.role==='مافیا');if(g.role!=='مافیا'&&!g.kill){let possible=aliveNow.filter(p=>p.role!=='مافیا');if(possible.length)g.kill=possible[Math.floor(Math.random()*possible.length)].name}if(g.role==='مافیا'&&!g.kill){let possible=aliveNow.filter(p=>p.role!=='مافیا');if(possible.length)g.kill=possible[Math.floor(Math.random()*possible.length)].name}if(g.role!=='دکتر'&&!g.heal){let possible=aliveNow.filter(p=>p.role!=='مافیا');if(possible.length&&Math.random()<.55)g.heal=possible[Math.floor(Math.random()*possible.length)].name}if(g.role==='دکتر'&&!g.heal)g.heal=aliveNow[Math.floor(Math.random()*aliveNow.length)]?.name;let victim=g.players.find(p=>p.name===g.kill),result='صبح شد؛ دیشب کسی حذف نشد.';if(victim&&victim.alive&&victim.name!==g.heal){victim.alive=false;result='صبح شد؛ '+victim.name+' در شب حذف شد.'}checkWin();if(!g)return;day(result)}
function day(result){g.phase='day';$('round').textContent='روز '+g.round;$('gameContent').innerHTML='<div class="panel"><h2>☀️ روز '+g.round+'</h2><p>'+esc(result)+'</p><div class="chat" id="chat"></div><p id="talkStatus">بازیکنان در حال صحبت هستند...</p><button class="btn" onclick="skipTalk()">رفتن به رأی‌گیری</button></div>'+playersList();let pool=bots(),i=0;function say(){if(!g||g.phase!=='day')return;if(i>=Math.min(7,pool.length+2)){clearInterval(t3);t2=setTimeout(vote,1500);$('talkStatus').textContent='بحث تمام شد؛ رأی‌گیری آغاز می‌شود.';return}let p=pool[i%Math.max(1,pool.length)];if(p){let a=S[p.style||0];$('chat').innerHTML+='<div class="msg"><b>'+esc(p.name)+':</b> '+a[(g.round+i)%a.length]+'</div>'}$('chat').scrollTop=$('chat').scrollHeight;i++}say();t3=setInterval(say,1500)}
function skipTalk(){clearInterval(t3);clearTimeout(t2);vote()}
function playersList(){return '<div class="panel"><h2>بازیکنان زنده</h2>'+alive().map(p=>'<div class="row">'+p.avatar+' '+esc(p.name)+(p.you?' (تو)':'')+' <b>🟢</b></div>').join('')+'</div>'}
function vote(){if(!g)return;g.phase='vote';$('round').textContent='رأی‌گیری';$('gameContent').innerHTML='<div class="panel"><h2>⚖️ رأی‌گیری</h2><p>به یک نفر رأی بده؛ رأی بات‌ها خودکار ثبت می‌شود.</p><div class="actions">'+bots().map(p=>'<button class="choice" onclick="cast(\''+esc(p.name)+'\')">'+p.avatar+' رأی به '+esc(p.name)+'</button>').join('')+'</div><button class="btn alt" onclick="cast(\'رد رأی\')">رد رأی</button></div>'+playersList()}
function cast(name){if(!g||g.phase!=='vote')return;let c={},voters=bots(),all=alive();voters.forEach(v=>{let opts=all.filter(x=>x.name!==v.name&&x.alive&&(v.role!=='مافیا'||x.role!=='مافیا'));if(opts.length){let chosen=opts.filter(x=>x.role==='مافیا');let target=chosen.length&&v.role!=='مافیا'&&Math.random()<.4?chosen[Math.floor(Math.random()*chosen.length)]:opts[Math.floor(Math.random()*opts.length)];c[target.name]=(c[target.name]||0)+1}});if(name!=='رد رأی')c[name]=(c[name]||0)+1;let sorted=Object.entries(c).sort((a,b)=>b[1]-a[1]),out=null;if(sorted.length&&!(sorted[1]&&sorted[0][1]===sorted[1][1])){out=g.players.find(p=>p.name===sorted[0][0]);if(out)out.alive=false}checkWin();if(!g)return;$('round').textContent='نتیجه';$('gameContent').innerHTML='<div class="panel" style="text-align:center"><div style="font-size:45px">⚖️</div><h2>'+(out?esc(out.name)+' حذف شد':'رأی مساوی شد؛ کسی حذف نشد')+'</h2>'+(out?'<p>نقش او: '+out.role+'</p>':'')+'<button class="btn" onclick="night()">شروع شب بعد</button></div>'+playersList()}
function checkWin(){if(!g)return;let m=alive().filter(p=>p.role==='مافیا').length,c=alive().length-m;if(m===0)finish(true);else if(m>=c)finish(false)}
function finish(city){stop();let p=prof(),won=(city&&g.role!=='مافیا')||(!city&&g.role==='مافیا');p.matches++;p.xp+=100;p.coins+=won?200:80;if(won)p.wins++;save(p);let h=JSON.parse(localStorage.history||'[]');h.unshift({date:new Date().toLocaleDateString('fa-IR'),result:city?'برد شهروندان':'برد مافیا',role:g.role});localStorage.history=JSON.stringify(h.slice(0,30));$('round').textContent='پایان';$('gameContent').innerHTML='<div class="role"><div class="ico">🏆</div><h2>'+(city?'شهروندان برنده شدند':'مافیا برنده شد')+'</h2><p>نقش تو: '+g.role+' • پاداش: '+(won?200:80)+' سکه و ۱۰۰ XP</p></div><div class="panel"><h2>نقش بازیکنان</h2>'+g.players.map(p=>'<div class="row">'+p.avatar+' '+esc(p.name)+' <b>'+p.role+'</b></div>').join('')+'</div><button class="btn" onclick="beginMatch()">بازی دوباره</button><button class="btn alt" onclick="g=null;show(\'home\')">خانه</button>';g=null}
function exitGame(){if(confirm('از مسابقه خارج می‌شوی؟')){stop();g=null;show('home')}}
refresh();show('home');
</script></main></body></html>
