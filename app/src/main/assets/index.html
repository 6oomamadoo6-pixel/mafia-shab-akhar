<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مافیا | شب آخر</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#342019,#101014 55%,#08080b);color:#f6eee2;font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:18px}.hero{height:210px;border:1px solid #8b652d;border-radius:22px;background:linear-gradient(0deg,#100c0b,#100c0b55);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 35px #0009}.logo{font-size:40px;font-weight:900;text-shadow:0 3px 18px #d99b37}.sub{color:#e6b95d;letter-spacing:3px}.panel{margin-top:16px;padding:17px;border:1px solid #5c4527;border-radius:18px;background:#171519;box-shadow:0 8px 24px #0006}.btn{border:0;border-radius:13px;padding:14px 16px;background:linear-gradient(100deg,#d9a344,#8b5a1b);color:#160f08;font-weight:bold;font-size:16px;width:100%;margin-top:10px}.btn.red{background:linear-gradient(100deg,#a93636,#641c25);color:white}.muted{color:#b5a99a;font-size:13px;line-height:1.8}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.player{background:#242127;border:1px solid #4a3a2c;border-radius:12px;padding:10px;font-size:13px}.player b{color:#e5b75d}.chat{height:240px;overflow:auto;background:#0d0c10;border-radius:12px;padding:10px;margin-top:12px}.line{padding:8px;border-bottom:1px solid #28242a;font-size:13px;line-height:1.7}.line strong{color:#e4b65c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.tag{display:inline-block;padding:5px 9px;background:#342a20;border-radius:30px;color:#edc16a;font-size:12px}.center{text-align:center}.title{font-size:21px;color:#efc36c;margin:0 0 8px}.choice{background:#252128;border:1px solid #57432b;color:#f5e8d0;border-radius:11px;padding:12px;width:100%;margin-top:7px;text-align:right}
</style></head><body><main class="wrap"><section class="hero"><div class="logo">مافیا</div><div class="sub">شــب آخــر</div><p class="muted">یک شب، ده بازیکن، فقط یک حقیقت</p></section><section id="home" class="panel center"><span class="tag">نسخه آزمایشی ۰٫۱</span><h2 class="title">به شهر خوش اومدی</h2><p class="muted">۱۰ نفر در بازی حضور دارن؛ ۳ مافیا و ۷ شهروند. حواست به حرف‌ها باشه، همه حقیقت رو نمی‌گن!</p><button class="btn" onclick="start()">شروع بازی</button><p class="muted">بازی آزمایشی تک‌نفره با ۹ بات • بدون نیاز به اینترنت</p></section><section id="game" class="panel hidden"><span class="tag" id="phase">شب اول</span> <span class="tag" id="role">نقش شما</span><h2 class="title" id="heading">شب فرا رسیده...</h2><p class="muted" id="hint"></p><div id="choices"></div><div class="players" id="players"></div><div class="chat" id="chat"></div><div class="actions"><button class="btn" onclick="next()">ادامه</button><button class="btn red" onclick="location.reload()">خروج از بازی</button></div></section></main><script>
const names=['آرمان','رها','سامان','نیلوفر','کامران','هستی','بردیا','ترانه','فرهاد'];const traits=['آروم و منطقی','شکاک و تند','شوخ‌طبع','کم‌حرف و مرموز','تحلیل‌گر'];let ppl=[],day=0,userRole='';const $=id=>document.getElementById(id);
function start(){let roles=['مافیا','مافیا','مافیا','دکتر','کارآگاه','شهروند','شهروند','شهروند','شهروند','شهروند'];roles.sort(()=>Math.random()-.5);userRole=roles.pop();ppl=names.map((n,i)=>({name:n,role:roles[i],trait:traits[i%traits.length],alive:true}));$('home').classList.add('hidden');$('game').classList.remove('hidden');$('role').textContent='نقش شما: '+userRole;$('hint').textContent=userRole==='مافیا'?'تو عضو تیم مافیایی. شب‌ها هدف انتخاب کن و روزها هویتت رو پنهان نگه دار.':userRole==='دکتر'?'هر شب می‌تونی یک نفر رو نجات بدی.':userRole==='کارآگاه'?'هر شب درباره هویت یک نفر تحقیق کن.':'با تحلیل حرف‌ها مافیا رو پیدا کن.';render();say('راوی','شهر در سکوت فرو رفته. شب اول آغاز می‌شود.');night();}
function render(){$('players').innerHTML=ppl.map(p=>'<div class="player">'+(p.alive?'🟢':'⚫')+' <b>'+p.name+'</b><br><span class="muted">'+p.trait+'</span></div>').join('')}
function say(n,t){$('chat').innerHTML+='<div class="line"><strong>'+n+':</strong> '+t+'</div>';$('chat').scrollTop=$('chat').scrollHeight}
function buttons(items,fn){$('choices').innerHTML=items.map((x,i)=>'<button class="choice" onclick="'+fn+'('+i+')">'+x+'</button>').join('')}
function aliveList(){return ppl.map((p,i)=>p.alive?i:-1).filter(i=>i>=0)}
function night(){ $('phase').textContent='شب '+(day+1);$('heading').textContent='شب شده؛ تصمیم بگیر';let list=aliveList();if(userRole==='مافیا')buttons(list.map(i=>'حذف '+ppl[i].name),'act');else if(userRole==='دکتر')buttons(list.map(i=>'نجات '+ppl[i].name),'act');else if(userRole==='کارآگاه')buttons(list.map(i=>'استعلام '+ppl[i].name),'act');else $('choices').innerHTML='<p class="muted">شهروندی؛ منتظر نتیجه شب بمان.</p><button class="btn" onclick="dayStart()">بیدار شدن</button>'}
function act(i){let list=aliveList(),target=list[i]??list[0];if(userRole==='کارآگاه'&&ppl[target])say('نتیجه استعلام',ppl[target].name+' '+(ppl[target].role==='مافیا'?'مشکوک است!':'مافیا نیست.'));else if(userRole==='مافیا'&&ppl[target])say('مافیا','هدف امشب: '+ppl[target].name);else if(userRole==='دکتر')say('دکتر','تصمیم نجات ثبت شد.');$('choices').innerHTML='<button class="btn" onclick="dayStart()">رفتن به روز</button>'}
function dayStart(){day++;$('phase').textContent='روز '+day;$('heading').textContent='جلسه شهروندان';$('hint').textContent='به حرف‌ها گوش کن و کسی رو که بهش شک داری انتخاب کن.';let alive=aliveList();for(let k=0;k<4;k++){let p=ppl[alive[Math.floor(Math.random()*alive.length)]];if(p)say(p.name,['من دیشب صدایی شنیدم، به نظرم باید دقیق‌تر بررسی کنیم.','رفتار بعضیا عجیبه؛ من فعلاً به '+ppl[alive[Math.floor(Math.random()*alive.length)]].name+' شک دارم.','بی‌دلیل اتهام نزنید، مدرک بیارید.','من ترجیح می‌دم فعلاً بیشتر گوش بدم.'][k]);}buttons(alive.map(i=>'رأی به '+ppl[i].name),'vote')}
function vote(i){let list=aliveList(),target=list[i]??list[0];if(ppl[target]){ppl[target].alive=false;say('نتیجه رأی‌گیری',ppl[target].name+' از شهر خارج شد.');render()}$('choices').innerHTML='<button class="btn" onclick="night()">شروع شب بعد</button>';if(aliveList().length<=4){$('heading').textContent='پایان دور آزمایشی';$('hint').textContent='برای تست دوباره بازی را از اول شروع کن.';$('choices').innerHTML='<button class="btn" onclick="location.reload()">بازی دوباره</button>'}}
function next(){dayStart()}
</script></body></html>
