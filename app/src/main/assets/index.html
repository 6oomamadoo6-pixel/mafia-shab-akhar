<section><div class="section-head" style="padding:0 17px"><h2 id="listTitle">تازه‌های یافتا</h2><button onclick="setCategory('همه')">مشاهده همه ←</button></div><div class="filters"><button class="chip active" onclick="setFilter('همه',this)">همه</button><button class="chip" onclick="setFilter('ارزان‌تر',this)">ارزان‌تر</button><button class="chip" onclick="setFilter('جدیدترین',this)">جدیدترین</button><button class="chip" onclick="setFilter('فقط عکس‌دار',this)">فقط عکس‌دار</button></div><div class="ads" id="ads"></div></section>
</main>
<nav class="bottom"><button class="nav active" onclick="showHome(this)"><span class="ni">⌂</span>خانه</button><button class="nav" onclick="showFavorites(this)"><span class="ni">♡</span>نشان‌شده‌ها</button><button class="nav add" onclick="openAdd()"><span class="ni">＋</span>ثبت آگهی</button><button class="nav" onclick="openChats(this)"><span class="ni"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-3.5-.8L4 20l1.2-3.5A7.2 7.2 0 0 1 4 12c0-4.2 3.6-7.5 8-7.5s8 2.8 8 7Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></span>پیام‌ها</button><button class="nav" onclick="showProfile(this)"><span class="ni">♙</span>پروفایل</button></nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script src="iran-locations.js"></script>
<script>
const seed=[{id:1,title:"آپارتمان ۸۰ متری، خوش‌نقشه",price:"۴٬۵۰۰٬۰۰۰٬۰۰۰ تومان",city:"تهران، پونک",cat:"املاک",emoji:"▦",kind:"house",desc:"آپارتمان ۸۰ متری، دو خواب، نورگیر، دارای پارکینگ و انباری."},{id:2,title:"پژو ۲۰۷ دنده‌ای مدل ۱۴۰۱",price:"۷۲۰٬۰۰۰٬۰۰۰ تومان",city:"کرج، عظیمیه",cat:"خودرو",emoji:"▰",kind:"car",desc:"خودرو تمیز و کم‌کارکرد، بیمه معتبر، آماده کارشناسی."},{id:3,title:"گوشی سامسونگ تمیز و سالم",price:"۱۸٬۵۰۰٬۰۰۰ تومان",city:"تهران، ستارخان",cat:"موبایل",emoji:"▯",kind:"phone",desc:"گوشی سالم، بدون خط و خش، همراه جعبه و لوازم."},{id:4,title:"مبل راحتی ۷ نفره",price:"۲۸٬۰۰۰٬۰۰۰ تومان",city:"اصفهان، مرداویج",cat:"لوازم خانه",emoji:"▤",kind:"home",desc:"مبل راحتی تمیز؛ به علت تغییر دکوراسیون فروخته می‌شود."}];
let ads=JSON.parse(localStorage.getItem("yaftaAds")||"null")||seed;let favorites=JSON.parse(localStorage.getItem("yaftaFav")||"[]"),category="همه",filter="همه",favMode=false;
function save(){localStorage.setItem("yaftaAds",JSON.stringify(ads));localStorage.setItem("yaftaFav",JSON.stringify(favorites))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function renderAds(){let q=document.getElementById("search").value.trim();let list=ads.filter(function(a){return(category==="همه"||a.cat===category)&&(!favMode||favorites.includes(a.id))&&(!q||(a.title+" "+a.city+" "+a.cat).includes(q))});if(filter==="ارزان‌تر")list=list.slice().reverse();if(filter==="فقط عکس‌دار")list=list.filter(function(a){return (a.photos&&a.photos.length)||a.emoji});document.getElementById("listTitle").textContent=favMode?"نشان‌شده‌های من":category==="همه"?"تازه‌های یافتا":category;document.getElementById("ads").innerHTML=list.length?list.map(function(a){return '<article class="ad" onclick="openDetail('+a.id+')"><div class="photo '+(a.kind||"home")+'">'+(a.photos&&a.photos.length?'<img src="'+a.photos[0]+'" style="width:100%;height:100%;min-height:116px;object-fit:cover;border-radius:15px">':(a.emoji||"▦"))+'</div><div class="ad-info"><p class="ad-title">'+esc(a.title)+'</p><div class="price">'+esc(a.price)+'</div><div class="meta"><span>'+esc(a.city)+'</span><button class="fav '+(favorites.includes(a.id)?"on":"")+'" onclick="event.stopPropagation();toggleFav('+a.id+')">'+(favorites.includes(a.id)?"♥":"♡")+'</button></div></div></article>'}).join(""):'<div class="empty">چیزی پیدا نشد!<br>عبارت دیگری جستجو کن یا دسته‌بندی را تغییر بده.</div>'}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(function(x){return x!==id}):favorites.concat([id]);save();renderAds();toast("وضعیت نشان‌شده‌ها ذخیره شد")}
function setCategory(c){category=c;favMode=false;renderAds();window.scrollTo({top:360,behavior:"smooth"})}
function setFilter(f,b){filter=f;document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("active")});b.classList.add("active");renderAds()}
function setNav(b){document.querySelectorAll(".nav").forEach(function(x){x.classList.remove("active")});b.classList.add("active")}
function showHome(b){favMode=false;category="همه";setNav(b);renderAds()}
function showFavorites(b){favMode=true;setNav(b);renderAds()}
function showProfile(b){setNav(b);showSheet('<div class="sheet-head"><h3>پروفایل من</h3><button class="close" onclick="closeSheet()">×</button></div><div style="text-align:center;padding:20px"><div style="font-size:48px">♙</div><h3>به یافتا خوش آمدی</h3><p class="detail-desc">ورود و مدیریت حساب کاربری در نسخه آنلاین فعال می‌شود.</p></div><button class="primary" onclick="closeSheet()">متوجه شدم</button>')}
function showSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("overlay").classList.add("show")}
function closeSheet(){document.getElementById("overlay").classList.remove("show")}
function openAdd(){showSheet('<div class="sheet-head"><h3>ثبت آگهی جدید</h3><button class="close" onclick="closeSheet()">×</button></div><form onsubmit="submitAd(event)"><div class="field"><label>عکس‌های آگهی</label><label class="upload-box" for="newPhotos"><div style="font-size:26px;color:#1769aa;margin-bottom:6px">＋</div><b>افزودن عکس</b><div style="font-size:10px;margin-top:5px">حداکثر ۵ عکس از گالری انتخاب کن</div><input id="newPhotos" type="file" accept="image/*" multiple onchange="previewPhotos(this)"></label><div id="photoPreview" class="preview-strip"></div></div><div class="field"><label>عنوان آگهی</label><input id="newTitle" required maxlength="65" placeholder="مثلاً آپارتمان ۷۵ متری"></div><div class="field"><label>دسته‌بندی</label><select id="newCat" onchange="categoryFields()"><option>املاک</option><option>خودرو</option><option>موبایل</option><option>استخدام</option><option>لوازم خانه</option><option>خدمات</option><option>ورزشی</option><option>سایر</option></select></div><div id="specificFields"></div><div class="field"><label>قیمت (تومان)</label><input id="newPrice" required inputmode="numeric" placeholder="قیمت را وارد کن یا توافقی بنویس"></div><div class="field"><label>وضعیت</label><select id="newCondition"><option>در حد نو</option><option>نو</option><option>کارکرده</option><option>نیازمند تعمیر</option></select></div><div class="field"><label>شهر و محله</label><input id="newCity" required placeholder="مثلاً تهران، سعادت‌آباد"></div><div class="field"><label>توضیحات کامل</label><textarea id="newDesc" required placeholder="ویژگی‌ها، شرایط فروش و هر نکته مهم را بنویس..."></textarea></div><div class="field"><label>شماره تماس</label><input id="newPhone" inputmode="tel" placeholder="شماره تماس (اختیاری)"></div><button class="primary" type="submit">ثبت آگهی</button><p class="detail-desc">در نسخه آزمایشی، اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</p></form>');categoryFields()}
function categoryFields(){let c=document.getElementById("newCat")?.value||"سایر";let sets={"املاک":[["متراژ","مثلاً ۸۰ متر"],["تعداد اتاق","مثلاً ۲"],["نوع معامله","خرید / رهن و اجاره"]],"خودرو":[["مدل و سال","مثلاً پژو ۲۰۷، ۱۴۰۱"],["کارکرد","مثلاً ۴۵٬۰۰۰ کیلومتر"],["گیربکس","دنده‌ای / اتوماتیک"]],"موبایل":[["برند و مدل","مثلاً Samsung A55"],["حافظه","مثلاً ۲۵۶ گیگ"],["وضعیت رجیستری","رجیستر شده / نشده"]],"استخدام":[["عنوان شغلی","مثلاً حسابدار"],["نوع همکاری","تمام‌وقت / پاره‌وقت"],["حقوق","مبلغ یا توافقی"]],"لوازم خانه":[["برند / مدل","نام برند یا مدل"],["وضعیت کالا","نو / کارکرده"]],"خدمات":[["نوع خدمت","عنوان خدمات"],["سابقه کار","مثلاً ۵ سال"]],"ورزشی":[["برند / مدل","نام برند یا مدل"],["وضعیت","نو / کارکرده"]],"سایر":[["ویژگی اصلی","اطلاعات تکمیلی"]]}[c];document.getElementById("specificFields").innerHTML=sets.map((x,i)=>'<div class="field"><label>'+x[0]+'</label><input class="extraField" data-label="'+x[0]+'" placeholder="'+x[1]+'"></div>').join("")}
let pendingPhotos=[];
function previewPhotos(input){pendingPhotos=[];let files=[...input.files].slice(0,5),out=document.getElementById("photoPreview");out.innerHTML="";files.forEach(file=>{let reader=new FileReader();reader.onload=e=>{pendingPhotos.push(e.target.result);let img=document.createElement("img");img.src=e.target.result;out.appendChild(img)};reader.readAsDataURL(file)})}
function submitAd(e){e.preventDefault();let c=document.getElementById("newCat").value,icons={"املاک":"⌂","خودرو":"▰","موبایل":"▯","استخدام":"▣","لوازم خانه":"▤","خدمات":"⌘","ورزشی":"◉","سایر":"▦"},spec={};document.querySelectorAll(".extraField").forEach(x=>{if(x.value.trim())spec[x.dataset.label]=x.value.trim()});let a={id:Date.now(),title:document.getElementById("newTitle").value,price:document.getElementById("newPrice").value+" تومان",city:document.getElementById("newCity").value,cat:c,emoji:icons[c],kind:c==="خودرو"?"car":c==="موبایل"?"phone":c==="املاک"?"house":"home",desc:document.getElementById("newDesc").value,condition:document.getElementById("newCondition").value,phone:document.getElementById("newPhone").value,spec:spec,photos:pendingPhotos.slice(0,5)};ads.unshift(a);try{save()}catch(err){a.photos=[];save()}category="همه";favMode=false;pendingPhotos=[];renderAds();closeSheet();toast("آگهی آزمایشی ثبت شد")}
let activeChatId=null;
let chats=JSON.parse(localStorage.getItem("yaftaChats")||"{}");
function saveChats(){localStorage.setItem("yaftaChats",JSON.stringify(chats))}
function openDetail(id){let a=ads.find(x=>x.id===id);if(!a)return;let pics=a.photos&&a.photos.length?a.photos:[];let hero=pics.length?'<img src="'+pics[0]+'">':'<div class="photo '+(a.kind||"home")+'" style="width:100%;height:100%;font-size:0"></div>';let specs=Object.entries(a.spec||{}).map(x=>'<div class="detail-item"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join("");let gallery=hero+(pics.length>1?'<div class="gallery-count">'+pics.length+' تصویر</div>':'');showSheet('<div class="sheet-head"><button class="close" onclick="closeSheet()">×</button><h3>جزئیات آگهی</h3><button class="close" onclick="toggleFav('+a.id+');openDetail('+a.id+')">'+(favorites.includes(a.id)?'♥':'♡')+'</button></div><div class="detail-wrap"><div class="detail-gallery">'+gallery+'</div><div class="detail-kicker">'+esc(a.cat)+'　/　'+esc(a.city)+'　/　آگهی در یافتا</div><h1 class="detail-title">'+esc(a.title)+'</h1><div class="detail-price">'+esc(a.price)+'</div><section class="detail-panel"><h4>مشخصات آگهی</h4><div class="detail-grid"><div class="detail-item"><small>وضعیت کالا</small><b>'+esc(a.condition||"ثبت نشده")+'</b></div><div class="detail-item"><small>دسته‌بندی</small><b>'+esc(a.cat)+'</b></div>'+specs+'</div></section><section class="detail-panel"><h4>توضیحات</h4><div class="detail-description">'+esc(a.desc||"توضیحی ثبت نشده است.")+'</div></section><section class="detail-panel"><h4>آگهی‌دهنده</h4><div class="seller-row"><div class="seller-avatar">ی</div><div><b style="font-size:12px">کاربر یافتا</b><div style="font-size:10px;color:#8293a4;margin-top:5px">پروفایل آزمایشی</div></div></div></section><p style="font-size:10px;color:#8191a0;line-height:2;padding:4px 3px">پیش از پرداخت، کالا را حضوری بررسی کن و از واریز بیعانه به افراد ناشناس خودداری کن.</p></div><div class="detail-actions"><button class="chat-btn" onclick="startChat('+a.id+')">گفت‌وگو با فروشنده</button><button class="call-btn" onclick="contactSeller('+a.id+')">تماس با آگهی‌دهنده</button></div>')}
function openChats(btn){if(btn)setNav(btn);let ids=Object.keys(chats);let rows=ids.length?ids.map(id=>{let c=chats[id],last=c.messages[c.messages.length-1];return '<button class="chat-row" onclick="openChat('+id+')"><span class="chat-avatar"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-3.5-.8L4 20l1.2-3.5A7.2 7.2 0 0 1 4 12c0-4.2 3.6-7.5 8-7.5s8 2.8 8 7Z"/></svg></span><span style="flex:1"><b>'+esc(c.title)+'</b><small>'+esc(last?last.text:"گفت‌وگو را شروع کنید")+'</small></span><small>'+esc(c.city)+'</small></button>'}).join(""):'<div style="text-align:center;padding:65px 20px;color:#7d8fa0"><div style="width:62px;height:62px;border-radius:20px;background:#e5f0f8;color:#1769aa;display:grid;place-items:center;margin:0 auto 16px"><svg viewBox="0 0 24 24" style="width:30px;stroke:currentColor;fill:none;stroke-width:1.6"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-3.5-.8L4 20l1.2-3.5A7.2 7.2 0 0 1 4 12c0-4.2 3.6-7.5 8-7.5s8 2.8 8 7Z"/></svg></div><b style="color:#304b63">هنوز گفت‌وگویی نداری</b><p style="font-size:11px;line-height:2">از صفحه هر آگهی می‌توانی گفت‌وگو را شروع کنی.</p></div>';showSheet('<div class="sheet-head"><button class="close" onclick="closeSheet()">×</button><h3>پیام‌های من</h3><span style="width:38px"></span></div><div class="chat-list">'+rows+'<p style="font-size:10px;color:#98a5b1;text-align:center;margin-top:24px">نسخه نمایشی؛ پیام‌ها فقط روی این دستگاه ذخیره می‌شوند.</p></div>')}
function startChat(id){let a=ads.find(x=>x.id===id);if(!a)return;let key=String(id);if(!chats[key])chats[key]={title:a.title,city:a.city,messages:[]};saveChats();openChat(id)}
function openChat(id){activeChatId=String(id);let c=chats[activeChatId];if(!c)return;let messages=c.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'theirs')+'">'+esc(m.text)+'<time>'+esc(m.time||"اکنون")+'</time></div>').join("");showSheet('<div class="sheet-head"><button class="close" onclick="openChats()">‹</button><h3>'+esc(c.title)+'</h3><span style="font-size:10px;color:#8495a4">گفت‌وگو</span></div><div class="chat-screen"><div class="chat-messages" id="chatMessages">'+messages+'<div style="text-align:center;font-size:9px;color:#95a3b0;padding:12px">گفت‌وگوی آزمایشی یافتا · پیام‌ها رمزنگاری سرتاسری نیستند</div></div><form class="chat-compose" onsubmit="sendChat(event)"><input id="chatInput" maxlength="1500" placeholder="پیامت را بنویس..." autocomplete="off"><button type="submit" aria-label="ارسال">➤</button></form></div>');let box=document.getElementById("chatMessages");box.scrollTop=box.scrollHeight}
function sendChat(e){e.preventDefault();let input=document.getElementById("chatInput"),v=input.value.trim();if(!v||!activeChatId)return;let c=chats[activeChatId];c.messages.push({text:v,mine:true,time:new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})});saveChats();openChat(Number(activeChatId))}
function contactSeller(id){let a=ads.find(x=>x.id===id);if(a&&a.phone){showSheet('<div class="sheet-head"><h3>ارتباط با آگهی‌دهنده</h3><button class="close" onclick="closeSheet()">×</button></div><div class="detail-block" style="text-align:center;padding:25px"><div style="font-size:26px;color:#1769aa">☎</div><h3 style="margin:12px">'+esc(a.phone)+'</h3><button class="primary" onclick="location.href=\'tel:'+esc(a.phone)+'\'">تماس</button></div>')}else toast("شماره تماس در این آگهی ثبت نشده است")}
function chooseCity(){if(!window.YAFTA_PROVINCES||!window.YAFTA_CITIES){toast("فهرست شهرها بارگذاری نشد");return}showProvinceList()}
function showProvinceList(){let current=document.getElementById("cityName").textContent;let rows=window.YAFTA_PROVINCES.map(p=>'<button class="location-row" onclick="showCityList('+p.id+')"><span>'+esc(p.name)+'</span><b>‹</b></button>').join("");showSheet('<div class="sheet-head"><h3>انتخاب استان</h3><button class="close" onclick="closeSheet()">×</button></div><div class="location-current">شهر فعلی: '+esc(current)+'</div><div class="location-list">'+rows+'</div>')}
function showCityList(provinceId){let province=window.YAFTA_PROVINCES.find(p=>p.id===provinceId);if(!province)return;let cities=window.YAFTA_CITIES.filter(c=>c.province_id===provinceId).sort((a,b)=>a.name.localeCompare(b.name,"fa"));let rows=cities.map(c=>'<button class="location-row" onclick="selectCityById('+c.id+')"><span>'+esc(c.name)+'</span><b>‹</b></button>').join("");showSheet('<div class="sheet-head"><button class="close" onclick="showProvinceList()">‹</button><h3>شهرهای '+esc(province.name)+'</h3><button class="close" onclick="closeSheet()">×</button></div><div class="location-list">'+(rows||'<div class="empty">شهری برای این استان ثبت نشده است.</div>')+'</div>')}
function selectCityById(cityId){let city=window.YAFTA_CITIES.find(c=>c.id===cityId);if(!city)return;let province=window.YAFTA_PROVINCES.find(p=>p.id===city.province_id);selectCity(city.name,province?province.name:"")}
function selectCity(city,province){document.getElementById("cityName").textContent=city;localStorage.setItem("yaftaCity",city);localStorage.setItem("yaftaProvince",province);closeSheet();toast("شهر "+city+" انتخاب شد")}
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(function(){el.style.display="none"},2200)}
renderAds();
</script></body></html>
