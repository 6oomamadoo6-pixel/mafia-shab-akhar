<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#eaf3fc"><title>یافتا</title>
<style>
:root{--bg:#eaf3fc;--blue:#3278c8;--ink:#172b43;--muted:#78899d;--line:#e3edf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,sans-serif;color:var(--ink);padding-bottom:85px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:680px;margin:auto}.top{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#4d94e5,#276ab7);color:white;display:grid;place-items:center;font-size:25px;font-weight:bold;box-shadow:0 7px 18px #3278c833}.brand h1{font-size:25px;margin:0;color:var(--blue)}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.city{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:#48627e;font-size:12px}.search-wrap{padding:7px 16px 16px}.search{height:52px;background:white;border:1px solid #dfebf7;border-radius:17px;display:flex;align-items:center;padding:0 15px;gap:10px;box-shadow:0 5px 18px #2d6ca00b}.search span{font-size:20px;color:var(--blue)}.search input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);font-size:13px;background:transparent}.search input::placeholder{color:#9aaabd}.section{padding:8px 17px 16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.section-head button{background:none;color:var(--blue);font-size:11px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{background:white;border:1px solid #e4eef8;border-radius:17px;padding:13px 5px 11px;text-align:center;color:var(--ink);box-shadow:0 4px 13px #3a75a00a}.cat .ico{width:42px;height:42px;border-radius:14px;background:#eaf3fc;display:grid;place-items:center;margin:0 auto 8px;font-size:22px}.cat b{font-size:11px;font-weight:600}.promo{margin:2px 16px 15px;padding:16px;border-radius:20px;background:linear-gradient(110deg,#276bb5,#4a91dc);color:white;display:flex;align-items:center;justify-content:space-between}.promo strong{font-size:15px}.promo p{font-size:10px;opacity:.9;margin:7px 0 0}.promo .spark{font-size:39px}.filters{display:flex;gap:8px;overflow:auto;padding:0 17px 12px}.chip{white-space:nowrap;padding:8px 13px;border-radius:30px;background:white;color:#637b94;border:1px solid var(--line);font-size:11px}.chip.active{background:var(--blue);color:white;border-color:var(--blue)}.ads{padding:0 16px;display:grid;gap:11px}.ad{background:white;border:1px solid #e3edf7;border-radius:18px;padding:10px;display:grid;grid-template-columns:112px 1fr;gap:12px;min-height:128px;box-shadow:0 4px 14px #386d9809}.photo{border-radius:13px;min-height:108px;display:grid;place-items:center;font-size:42px}.photo.house{background:linear-gradient(145deg,#d8e8f5,#a8c9e5)}.photo.car{background:linear-gradient(145deg,#e8e9ed,#b9c5d2)}.photo.phone{background:linear-gradient(145deg,#e3e9f8,#b7c7e7)}.photo.home{background:linear-gradient(145deg,#f1e8dd,#d8c2a7)}.ad-info{display:flex;flex-direction:column;min-width:0;padding:3px 0}.ad-title{font-size:13px;font-weight:bold;line-height:1.7;margin:0 0 7px}.price{font-size:13px;font-weight:bold;color:var(--blue);margin-top:auto}.meta{font-size:10px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;align-items:center}.fav{background:#f1f6fb;color:#7e91a6;border-radius:10px;width:30px;height:30px;font-size:16px}.fav.on{color:#e35e79;background:#fff0f3}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid #dce8f4;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav{background:none;color:#8799ac;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:3px}.nav .ni{font-size:21px}.nav.active{color:var(--blue);font-weight:bold}.nav.add .ni{background:var(--blue);color:white;width:39px;height:31px;border-radius:11px;display:grid;place-items:center;margin-top:-12px}.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:13px}.overlay{position:fixed;inset:0;background:#10243c66;z-index:20;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#f8fbff;width:min(100%,680px);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.sheet h3{margin:0;font-size:17px}.close{background:#e8f1fa;border-radius:10px;width:34px;height:34px;color:#52708f;font-size:20px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#5d738b}.field input,.field textarea,.field select{border:1px solid #dce8f4;background:white;border-radius:13px;padding:13px;outline:none;color:var(--ink);font-size:13px;width:100%}.field textarea{min-height:80px;resize:vertical}.primary{background:var(--blue);color:white;border-radius:14px;padding:14px;width:100%;font-weight:bold;margin-top:8px}.detail-photo{height:180px;border-radius:18px;display:grid;place-items:center;font-size:65px;margin-bottom:15px}.detail-desc{font-size:12px;line-height:2;color:#60758b}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#18344f;color:white;padding:11px 16px;border-radius:12px;font-size:11px;display:none;z-index:30;white-space:nowrap}@media(min-width:520px){.ads{grid-template-columns:1fr 1fr}.ad{grid-template-columns:95px 1fr}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="logo">ی</div><div><h1>یافتا</h1><small>هرچی می‌خوای، اینجاست!</small></div></div><button class="city" onclick="chooseCity()">📍 <span id="cityName">تهران</span>⌄</button></header>
<div class="search-wrap"><label class="search"><span>⌕</span><input id="search" placeholder="جستجو در آگهی‌ها..." oninput="renderAds()"><span>☷</span></label></div>
<section class="section"><div class="section-head"><h2>دسته‌بندی‌ها</h2><button onclick="setCategory('همه')">همه دسته‌ها ←</button></div><div class="cats">
<button class="cat" onclick="setCategory('املاک')"><div class="ico">🏠</div><b>املاک</b></button><button class="cat" onclick="setCategory('خودرو')"><div class="ico">🚗</div><b>خودرو</b></button><button class="cat" onclick="setCategory('موبایل')"><div class="ico">📱</div><b>موبایل</b></button><button class="cat" onclick="setCategory('استخدام')"><div class="ico">💼</div><b>استخدام</b></button><button class="cat" onclick="setCategory('لوازم خانه')"><div class="ico">🛋️</div><b>لوازم خانه</b></button><button class="cat" onclick="setCategory('خدمات')"><div class="ico">🛠️</div><b>خدمات</b></button><button class="cat" onclick="setCategory('ورزشی')"><div class="ico">⚽</div><b>ورزشی</b></button><button class="cat" onclick="setCategory('سایر')"><div class="ico">📦</div><b>سایر</b></button>
</div></section>
<div class="promo" onclick="openAdd()"><div><strong>چیزی برای فروش داری؟</strong><p>رایگان آگهی‌ات رو در یافتا ثبت کن</p></div><div class="spark">📣</div></div>
<section><div class="section-head" style="padding:0 17px"><h2 id="listTitle">تازه‌های یافتا</h2><button onclick="setCategory('همه')">مشاهده همه ←</button></div><div class="filters"><button class="chip active" onclick="setFilter('همه',this)">همه</button><button class="chip" onclick="setFilter('ارزان‌تر',this)">ارزان‌تر</button><button class="chip" onclick="setFilter('جدیدترین',this)">جدیدترین</button><button class="chip" onclick="setFilter('فقط عکس‌دار',this)">فقط عکس‌دار</button></div><div class="ads" id="ads"></div></section>
</main>
<nav class="bottom"><button class="nav active" onclick="showHome(this)"><span class="ni">⌂</span>خانه</button><button class="nav" onclick="showFavorites(this)"><span class="ni">♡</span>نشان‌شده‌ها</button><button class="nav add" onclick="openAdd()"><span class="ni">＋</span>ثبت آگهی</button><button class="nav" onclick="showProfile(this)"><span class="ni">♙</span>پروفایل</button></nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const seed=[{id:1,title:"آپارتمان ۸۰ متری، خوش‌نقشه",price:"۴٬۵۰۰٬۰۰۰٬۰۰۰ تومان",city:"تهران، پونک",cat:"املاک",emoji:"🏢",kind:"house",desc:"آپارتمان ۸۰ متری، دو خواب، نورگیر، دارای پارکینگ و انباری."},{id:2,title:"پژو ۲۰۷ دنده‌ای مدل ۱۴۰۱",price:"۷۲۰٬۰۰۰٬۰۰۰ تومان",city:"کرج، عظیمیه",cat:"خودرو",emoji:"🚙",kind:"car",desc:"خودرو تمیز و کم‌کارکرد، بیمه معتبر، آماده کارشناسی."},{id:3,title:"گوشی سامسونگ تمیز و سالم",price:"۱۸٬۵۰۰٬۰۰۰ تومان",city:"تهران، ستارخان",cat:"موبایل",emoji:"📱",kind:"phone",desc:"گوشی سالم، بدون خط و خش، همراه جعبه و لوازم."},{id:4,title:"مبل راحتی ۷ نفره",price:"۲۸٬۰۰۰٬۰۰۰ تومان",city:"اصفهان، مرداویج",cat:"لوازم خانه",emoji:"🛋️",kind:"home",desc:"مبل راحتی تمیز؛ به علت تغییر دکوراسیون فروخته می‌شود."}];
let ads=JSON.parse(localStorage.getItem("yaftaAds")||"null")||seed;let favorites=JSON.parse(localStorage.getItem("yaftaFav")||"[]"),category="همه",filter="همه",favMode=false;
function save(){localStorage.setItem("yaftaAds",JSON.stringify(ads));localStorage.setItem("yaftaFav",JSON.stringify(favorites))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function renderAds(){let q=document.getElementById("search").value.trim();let list=ads.filter(function(a){return(category==="همه"||a.cat===category)&&(!favMode||favorites.includes(a.id))&&(!q||(a.title+" "+a.city+" "+a.cat).includes(q))});if(filter==="ارزان‌تر")list=list.slice().reverse();if(filter==="فقط عکس‌دار")list=list.filter(function(a){return a.emoji});document.getElementById("listTitle").textContent=favMode?"نشان‌شده‌های من":category==="همه"?"تازه‌های یافتا":category;document.getElementById("ads").innerHTML=list.length?list.map(function(a){return '<article class="ad" onclick="openDetail('+a.id+')"><div class="photo '+(a.kind||"home")+'">'+(a.emoji||"📦")+'</div><div class="ad-info"><p class="ad-title">'+esc(a.title)+'</p><div class="price">'+esc(a.price)+'</div><div class="meta"><span>'+esc(a.city)+'</span><button class="fav '+(favorites.includes(a.id)?"on":"")+'" onclick="event.stopPropagation();toggleFav('+a.id+')">'+(favorites.includes(a.id)?"♥":"♡")+'</button></div></div></article>'}).join(""):'<div class="empty">چیزی پیدا نشد!<br>عبارت دیگری جستجو کن یا دسته‌بندی را تغییر بده.</div>'}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(function(x){return x!==id}):favorites.concat([id]);save();renderAds();toast("وضعیت نشان‌شده‌ها ذخیره شد")}
function setCategory(c){category=c;favMode=false;renderAds();window.scrollTo({top:360,behavior:"smooth"})}
function setFilter(f,b){filter=f;document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("active")});b.classList.add("active");renderAds()}
function setNav(b){document.querySelectorAll(".nav").forEach(function(x){x.classList.remove("active")});b.classList.add("active")}
function showHome(b){favMode=false;category="همه";setNav(b);renderAds()}
function showFavorites(b){favMode=true;setNav(b);renderAds()}
function showProfile(b){setNav(b);showSheet('<div class="sheet-head"><h3>پروفایل من</h3><button class="close" onclick="closeSheet()">×</button></div><div style="text-align:center;padding:20px"><div style="font-size:48px">👤</div><h3>به یافتا خوش آمدی</h3><p class="detail-desc">ورود و مدیریت حساب کاربری در نسخه آنلاین فعال می‌شود.</p></div><button class="primary" onclick="closeSheet()">متوجه شدم</button>')}
function showSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("overlay").classList.add("show")}
function closeSheet(){document.getElementById("overlay").classList.remove("show")}
function openAdd(){showSheet('<div class="sheet-head"><h3>ثبت آگهی جدید</h3><button class="close" onclick="closeSheet()">×</button></div><form onsubmit="submitAd(event)"><div class="field"><label>عنوان آگهی</label><input id="newTitle" required maxlength="65" placeholder="مثلاً آپارتمان ۷۵ متری"></div><div class="field"><label>قیمت</label><input id="newPrice" required placeholder="مثلاً ۲٬۵۰۰٬۰۰۰٬۰۰۰ تومان"></div><div class="field"><label>دسته‌بندی</label><select id="newCat"><option>املاک</option><option>خودرو</option><option>موبایل</option><option>استخدام</option><option>لوازم خانه</option><option>خدمات</option><option>ورزشی</option><option>سایر</option></select></div><div class="field"><label>شهر و محله</label><input id="newCity" required placeholder="مثلاً تهران، سعادت‌آباد"></div><div class="field"><label>توضیحات</label><textarea id="newDesc" placeholder="جزئیات آگهی را بنویس..."></textarea></div><button class="primary" type="submit">ثبت آگهی</button><p class="detail-desc">نسخه آزمایشی: آگهی فقط روی همین دستگاه ذخیره می‌شود.</p></form>')}
function submitAd(e){e.preventDefault();let c=document.getElementById("newCat").value,icons={"املاک":"🏠","خودرو":"🚗","موبایل":"📱","استخدام":"💼","لوازم خانه":"🛋️","خدمات":"🛠️","ورزشی":"⚽","سایر":"📦"};ads.unshift({id:Date.now(),title:document.getElementById("newTitle").value,price:document.getElementById("newPrice").value,city:document.getElementById("newCity").value,cat:c,emoji:icons[c],kind:"home",desc:document.getElementById("newDesc").value});save();category="همه";favMode=false;renderAds();closeSheet();toast("آگهی آزمایشی با موفقیت ثبت شد")}
function openDetail(id){let a=ads.find(function(x){return x.id===id});if(!a)return;showSheet('<div class="sheet-head"><h3>جزئیات آگهی</h3><button class="close" onclick="closeSheet()">×</button></div><div class="detail-photo photo '+(a.kind||"home")+'">'+a.emoji+'</div><h3>'+esc(a.title)+'</h3><h3 style="color:var(--blue);margin:12px 0">'+esc(a.price)+'</h3><p class="detail-desc">📍 '+esc(a.city)+'<br><br>'+esc(a.desc||"توضیحی ثبت نشده است.")+'</p><button class="primary" onclick="toast(\'گفتگو در نسخه آنلاین فعال می‌شود\')">✉️ تماس با آگهی‌دهنده</button><button class="primary" style="background:#e4effa;color:#2868ad" onclick="toggleFav('+a.id+');closeSheet()">♡ افزودن به نشان‌شده‌ها</button>')}
function chooseCity(){showSheet('<div class="sheet-head"><h3>انتخاب شهر</h3><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>نام شهر</label><input id="cityInput" value="'+esc(document.getElementById("cityName").textContent)+'" placeholder="نام شهر"></div><button class="primary" onclick="document.getElementById(\'cityName\').textContent=document.getElementById(\'cityInput\').value||\'تهران\';closeSheet()">ذخیره شهر</button>')}
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(function(){el.style.display="none"},2200)}
renderAds();
</script></body></html>
